<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Водопровод</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{min-height:100vh;display:grid;place-items:center;background:#16233a;font-family:Rubik,sans-serif;color:#eaf2ff}
.app{width:430px;border-radius:36px;background:linear-gradient(180deg,#1f3558,#152640);padding:26px 22px 30px;box-shadow:0 40px 90px -30px #000c}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.lv{font:800 26px Rubik}.lv small{display:block;font:500 13px Rubik;color:#8fb2e6}
.moves{background:#0f1c30;border-radius:14px;padding:8px 14px;font:700 18px Rubik;color:#7fe0ff}
canvas{display:block;width:386px;height:386px;border-radius:22px;background:#0f1c30;touch-action:manipulation}
.stars{display:flex;gap:8px;justify-content:center;margin-top:18px}
.stars i{width:34px;height:34px;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);background:#2a4167}
.stars i.on{background:#ffcf4a}
.hint{text-align:center;margin-top:12px;color:#8fb2e6;font-size:14px}
.win{position:absolute;inset:0;display:none;place-items:center;background:#0b1424cc}
.win div{background:#fff;color:#16233a;border-radius:24px;padding:30px 40px;text-align:center;font:800 28px Rubik}
</style></head><body>
<div class="app">
 <div class="top"><div class="lv">Уровень 7<small>Проведи воду к грядкам</small></div><div class="moves" id="mv">Ходы: 0</div></div>
 <canvas id="c" width="772" height="772"></canvas>
 <div class="stars" id="st"><i class="on"></i><i class="on"></i><i></i></div>
 <div class="hint">Нажимай на трубы, чтобы поворачивать</div>
</div>
<script>
const N = 6, S = 772 / N, cv = document.getElementById('c'), g = cv.getContext('2d')
const D = [[0, -1], [1, 0], [0, 1], [-1, 0]]
const TYPES = { I: [1, 0, 1, 0], L: [1, 1, 0, 0], T: [1, 1, 1, 0], X: [1, 1, 1, 1] }
let seed = +(new URLSearchParams(location.search).get('seed') || 7)
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647
const SRC = [0, 2], DST = [5, 3]
function build() {
  const path = [[0, 2], [1, 2], [1, 1], [2, 1], [3, 1], [3, 2], [3, 3], [4, 3], [5, 3]]
  const grid = Array.from({ length: N }, () => Array(N).fill(null))
  path.forEach(([x, y], i) => {
    const c = [0, 0, 0, 0]
    const nb = [path[i - 1], path[i + 1]]
    if (i === 0) c[3] = 1
    if (i === path.length - 1) c[1] = 1
    nb.forEach(p => { if (p) { const k = D.findIndex(([dx, dy]) => dx === p[0] - x && dy === p[1] - y); c[k] = 1 } })
    grid[y][x] = c
  })
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (!grid[y][x]) { const t = Object.values(TYPES)[Math.floor(rnd() * 3)]; grid[y][x] = t.slice() }
  const rot = grid.map(r => r.map(() => Math.floor(rnd() * 4)))
  return { grid, rot, path }
}
const st = build()
const ports = (x, y) => { const c = st.grid[y][x], r = st.rot[y][x]; return c.map((_, k) => c[(k - r + 4) % 4]) }
function flow() {
  const wet = Array.from({ length: N }, () => Array(N).fill(false)); const q = [SRC]
  if (!ports(...SRC)[3]) return wet
  wet[SRC[1]][SRC[0]] = true
  while (q.length) { const [x, y] = q.shift(); const p = ports(x, y)
    p.forEach((o, k) => { if (!o) return; const nx = x + D[k][0], ny = y + D[k][1]; if (nx < 0 || ny < 0 || nx >= N || ny >= N || wet[ny][nx]) return; if (ports(nx, ny)[(k + 2) % 4]) { wet[ny][nx] = true; q.push([nx, ny]) } }) }
  return wet
}
function pipe(x, y, wet) {
  const cx = x * S + S / 2, cy = y * S + S / 2, p = ports(x, y)
  g.fillStyle = (x + y) % 2 ? '#132440' : '#152a4a'; g.fillRect(x * S, y * S, S, S)
  g.lineCap = 'round'
  for (const [w, col] of [[S * 0.34, wet ? '#0d5b7c' : '#253a5c'], [S * 0.2, wet ? '#39c6ff' : '#3c5680']]) {
    g.strokeStyle = col; g.lineWidth = w
    p.forEach((o, k) => { if (!o) return; g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx + D[k][0] * S / 2, cy + D[k][1] * S / 2); g.stroke() })
  }
  g.fillStyle = wet ? '#9be7ff' : '#4d6a96'; g.beginPath(); g.arc(cx, cy, S * 0.11, 0, 7); g.fill()
  if (wet) { g.fillStyle = '#ffffff55'; g.beginPath(); g.arc(cx - S * 0.03, cy - S * 0.03, S * 0.04, 0, 7); g.fill() }
}
let moves = 0
function draw() {
  const wet = flow()
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) pipe(x, y, wet[y][x])
  g.fillStyle = '#39c6ff'; g.beginPath(); g.roundRect(-10, SRC[1] * S + S * 0.2, 26, S * 0.6, 10); g.fill()
  const gx = DST[0] * S + S, gy = DST[1] * S
  g.fillStyle = wet[DST[1]][DST[0]] ? '#5ad17a' : '#3c7a4e'; g.beginPath(); g.roundRect(gx - 22, gy + S * 0.18, 30, S * 0.64, 10); g.fill()
  document.getElementById('mv').textContent = 'Ходы: ' + moves
  return wet[DST[1]][DST[0]]
}
cv.addEventListener('click', e => { const r = cv.getBoundingClientRect(); const x = Math.floor((e.clientX - r.left) / r.width * N), y = Math.floor((e.clientY - r.top) / r.height * N)
  st.rot[y][x] = (st.rot[y][x] + 1) % 4; moves++; if (draw()) document.querySelector('.hint').textContent = 'Вода дошла! Уровень пройден' })
window.solveTo = (k) => { st.path.slice(0, k).forEach(([x, y]) => { st.rot[y][x] = 0 }); moves = 11; draw() }
draw(); const sv=new URLSearchParams(location.search).get('solve'); if(sv) window.solveTo(+sv)
window.renderAt = (t) => { const k = Math.min(9, Math.floor(t * 11)); st.path.forEach(([x, y], i) => { if (i < k) st.rot[y][x] = 0 }); moves = k * 2; if (draw()) { document.querySelector('.hint').textContent = 'Вода дошла! Уровень пройден'; document.querySelectorAll('.stars i').forEach(i => i.classList.add('on')) } }
document.body.dataset.ready = '1'
</script></body></html>
